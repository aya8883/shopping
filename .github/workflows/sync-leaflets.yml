# Refresh weekly flyer catalogs every 6 hours from FullFlyer/ilofo
# (official store sites block scrapers; flyers are the reliable public source).
#
# Manual run: Actions → "Sync weekly leaflets" → Run workflow
name: Sync weekly leaflets

on:
  schedule:
    # Every 6 hours (UTC): 00:00, 06:00, 12:00, 18:00
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      with_images:
        description: Also refresh product category images
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Discover + sync leaflets
        run: node scripts/sync-all.mjs

      - name: Sync product images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.with_images }}
        run: node scripts/sync-store-product-images.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaflet-sources.json \
            frontend/src/data/leaflet-manifest.json \
            frontend/public/data/leaflet-manifest.json \
            frontend/src/data/product-images-manifest.json \
            frontend/public/products/stores || true
          if git diff --staged --quiet; then
            echo "No leaflet/catalog changes."
          else
            git commit -m "chore: refresh weekly leaflets ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
