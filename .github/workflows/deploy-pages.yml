# Deploy the PWA to GitHub Pages (HTTPS) on every push to main.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /shopping/
          VITE_USE_MOCK_DATA: 'true'
          VITE_APP_NAME: Wain Awfar
          VITE_APP_NAME_AR: وين أوفر؟
          VITE_APP_SLOGAN: Compare. Save. Shop smarter.
          VITE_APP_SLOGAN_AR: قارن. وفر. تسوق بذكاء.
          VITE_DEFAULT_CITY: Riyadh
          VITE_DEFAULT_COUNTRY: SA
          VITE_DEFAULT_CURRENCY: SAR
          VITE_DEFAULT_TIMEZONE: Asia/Riyadh
          VITE_DEFAULT_LOCALE: ar
          VITE_HASURA_GRAPHQL_URL: https://aya8883.github.io/v1/graphql
          VITE_SUPERTOKENS_API_DOMAIN: https://aya8883.github.io
          VITE_WEBSITE_DOMAIN: https://aya8883.github.io
        run: npm run build

      - name: SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
