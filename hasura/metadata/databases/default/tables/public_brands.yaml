table:
  name: brands
  schema: public
array_relationships:
  - name: products
    using:
      foreign_key_constraint_on:
        column: brand_id
        table:
          name: products
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns: "*"
      filter:
        active: { _eq: true }
      allow_aggregations: true
  - role: consumer
    permission:
      columns: "*"
      filter:
        active: { _eq: true }
      allow_aggregations: true
  - role: reviewer
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
  - role: admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: admin
    permission:
      check: {}
      columns: "*"
update_permissions:
  - role: admin
    permission:
      columns: "*"
      filter: {}
      check: {}
delete_permissions:
  - role: admin
    permission:
      filter: {}
